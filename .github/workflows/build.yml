name: Build

# Every push: core tests, accessibility check, and .ipa files for iPhone/iPad,
# Apple TV and Vision Pro. A v* tag also publishes them as a GitHub release.
# The owner's certificate signs builds; AltStore re-signs with a profile on installation.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Core tests
        working-directory: Core
        run: |
          # pipefail: tail always succeeds, so without it a failing test would pass the step.
          set -o pipefail
          swift test 2>&1 | tail -40

      - name: a11y-check source
        run: git clone --depth 1 https://github.com/cvs-health/ios-swiftui-accessibility-techniques.git "$RUNNER_TEMP/cvs"

      - name: a11y-check build cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cvs/a11y-check/.build
          key: a11ycheck-${{ runner.os }}-v1

      - name: Accessibility check (a11y-check, CVS Health)
        run: |
          # pipefail: the checker exits 1 on errors and tee hides that, so the gate was open.
          set -o pipefail
          cd "$RUNNER_TEMP/cvs/a11y-check" && swift build -c release 2>&1 | tail -3
          "$RUNNER_TEMP/cvs/a11y-check/.build/release/a11y-check" "$GITHUB_WORKSPACE/App" | tee "$GITHUB_WORKSPACE/a11y-report.txt"

      - name: Generate project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Package cache (VLCKit is an 800 MB download)
        uses: actions/cache@v6
        with:
          path: SourcePackages
          key: spm-${{ hashFiles('project.yml') }}

      - name: On-device conversion integration test
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild -project AccessibleIPTV.xcodeproj -scheme AccessibleIPTV -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath TestBuild \
            -clonedSourcePackagesDirPath SourcePackages -resultBundlePath PlaybackTests.xcresult \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee playback-integration.log | tail -60

      # The owner's Apple Development certificate (the one AltStore made), from repo secrets.
      # No provisioning profile: AltStore re-signs with its own on install.
      - name: Signing keychain
        env:
          P12: ${{ secrets.IOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "No certificate secret (fork PR): build unsigned"; exit 0; }
          KC="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/new.p12"
          # macOS security cannot read OpenSSL 3's AES/SHA-256 PKCS#12 (MAC verification failed):
          # re-pack it with 3DES and a SHA-1 MAC.
          OSSL="$(brew --prefix openssl@3)/bin/openssl"
          "$OSSL" pkcs12 -in "$RUNNER_TEMP/new.p12" -passin env:P12_PASSWORD -nodes -out "$RUNNER_TEMP/pem"
          "$OSSL" pkcs12 -export -in "$RUNNER_TEMP/pem" -out "$RUNNER_TEMP/cert.p12" -passout env:P12_PASSWORD -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
          rm "$RUNNER_TEMP/new.p12" "$RUNNER_TEMP/pem"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer"
          security import "$RUNNER_TEMP/wwdr.cer" -k "$KC" -T /usr/bin/codesign || true
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -p codesigning "$KC" | awk '/\)/{print $2; exit}')
          TEAM=$(security find-certificate -c "$ID" -p "$KC" 2>/dev/null | openssl x509 -noout -subject | sed -n 's/.*OU *= *\([A-Z0-9]*\).*/\1/p')
          [ -n "$TEAM" ] || TEAM=J7645K945T
          echo "Signing with $ID, team $TEAM"
          echo "SIGN_ID=$ID" >> "$GITHUB_ENV"
          echo "SIGN_TEAM=$TEAM" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build
        run: |
          set -o pipefail
          VERSION=$(sed -n 's/ *MARKETING_VERSION: *//p' project.yml)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sign() { # app bundle: nested code first, then the app with its identifier
            [ -n "$SIGN_ID" ] || { echo "No signing certificate: unsigned"; return; }
            find "$1" -depth \( -name "*.framework" -o -name "*.dylib" -o -name "*.appex" \) -print0 |
              xargs -0 -I{} codesign --force --timestamp=none --keychain "$KEYCHAIN" --sign "$SIGN_ID" {}
            cp App/AccessibleIPTV.entitlements "$RUNNER_TEMP/app.entitlements"
            /usr/libexec/PlistBuddy -c "Add :application-identifier string $SIGN_TEAM.dev.serrebi.accessibleiptv" \
              -c "Add :com.apple.developer.team-identifier string $SIGN_TEAM" "$RUNNER_TEMP/app.entitlements"
            codesign --force --timestamp=none --keychain "$KEYCHAIN" --sign "$SIGN_ID" --entitlements "$RUNNER_TEMP/app.entitlements" "$1"
            codesign --verify --deep --strict "$1" && codesign -dv "$1" 2>&1 | grep -E "Authority|TeamIdentifier" | head -3
          }
          build() { # platform, products folder, file suffix
            xcodebuild -project AccessibleIPTV.xcodeproj -scheme AccessibleIPTV -configuration Release \
              -destination "generic/platform=$1" -derivedDataPath build -clonedSourcePackagesDirPath SourcePackages \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -60
            rm -rf Payload && mkdir Payload
            cp -R "build/Build/Products/Release-$2/AccessibleIPTV.app" Payload/
            sign Payload/AccessibleIPTV.app
            zip -qry "AccessibleIPTV-$VERSION-$3.ipa" Payload
          }
          build iOS iphoneos iOS
          build tvOS appletvos tvOS
          build visionOS xros visionOS
          ls -la *.ipa

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ipa
          path: |
            *.ipa
            a11y-report.txt
            playback-integration.log
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk "/^## $VERSION/{f=1;next}/^## /{f=0}f" CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" *.ipa --title "Accessible IPTV Client for iOS $VERSION" --notes-file notes.md --latest
