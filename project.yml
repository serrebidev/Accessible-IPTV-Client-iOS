# XcodeGen spec: `xcodegen generate` writes AccessibleIPTV.xcodeproj (not committed).
# One multiplatform target: iPhone, iPad (with CarPlay), Apple TV and Apple Vision Pro.
name: AccessibleIPTV
options:
  bundleIdPrefix: dev.serrebi
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
    visionOS: "2.0"
packages:
  IPTVCore:
    path: Core
  # SwiftVLC (libVLC 4) plus Player.setVideoEnabled, which the upstream API lacks.
  SwiftVLC:
    url: https://github.com/serrebidev/SwiftVLC.git
    revision: 76b74b0e6114deff686a8bed78800aef7d1aaba7
settings:
  base:
    MARKETING_VERSION: 0.6.4
    CURRENT_PROJECT_VERSION: 33
    SWIFT_VERSION: "5.0"
targets:
  AccessibleIPTV:
    type: application
    platform: auto
    supportedDestinations: [iOS, tvOS, visionOS]
    sources:
      - path: App
      - path: Resources
    scheme:
      testTargets: [PlaybackTests]
    dependencies:
      - package: IPTVCore
      - package: SwiftVLC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.serrebi.accessibleiptv
        PRODUCT_NAME: AccessibleIPTV
        CODE_SIGN_ENTITLEMENTS: App/AccessibleIPTV.entitlements
        # Siri actions are iPhone/iPad-only; other targets have no App Intents metadata to extract.
        "LM_SKIP_METADATA_EXTRACTION[sdk=appletvos*]": YES
        "LM_SKIP_METADATA_EXTRACTION[sdk=xros*]": YES
        TARGETED_DEVICE_FAMILY: "1,2,3,7"
        # One 1024 px icon for iPhone and iPad; Apple TV and Vision Pro use the system placeholder.
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphone*]": AppIcon
        ENABLE_PREVIEWS: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Accessible IPTV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar, de, es, fr, hi, hu, it, ja, pl, pt-BR, ru, tr, zh-Hans]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSUserActivityTypes: [dev.serrebi.accessibleiptv.channel, com.apple.corespotlightitem]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Wheelchair mounts and TV stands: every orientation.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Sound keeps playing with the screen locked; recordings keep running in the background.
        UIBackgroundModes: [audio]
        AVInitialRouteSharingPolicy: LongFormVideo
        # IPTV providers serve plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Finds playback devices and shares converted video with them.
        NSBonjourServices: [_googlecast._tcp]
        NSMicrophoneUsageDescription: Voice search listens for a channel name.
        NSSpeechRecognitionUsageDescription: Voice search turns what you say into a search.
        # Recordings appear in the Files app under On My iPhone.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        LSApplicationQueriesSchemes: [vlc-x-callback, infuse, nplayer-http, nplayer-https, outplayer, altstore, sidestore]
  PlaybackTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AppTests
        excludes: ["*.ts"]
      - path: AppTests/mpeg2-mp2.ts
        buildPhase: resources
    dependencies:
      - target: AccessibleIPTV
      - package: SwiftVLC
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
